[project]
name = "pg-publisher"
version = "0.1.0"
description = "GUI for managing Postgres publications/subscriptions across databases with live replication metrics."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "testcontainers[postgres]==4.9.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[project.scripts]
pg-publisher = "pg_publisher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/pg_publisher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# B008: FastAPI's `Depends(...)` in parameter defaults is the framework idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend/pg_publisher"]
